<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B4B8C">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <title>المحاضرات الأونلاين | الأكاديمية الدولية</title>
    <meta name="description" content="محاضرات أونلاين متخصصة في التدريب والاستشارات العلمية.">
    <link rel="canonical" href="https://internationalacademy.vercel.app/online-lectures.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="المحاضرات الأونلاين | الأكاديمية الدولية">
    <meta property="og:description" content="محاضرات أونلاين متخصصة في التدريب والاستشارات العلمية.">
    <meta property="og:url" content="https://internationalacademy.vercel.app/online-lectures.html">
    <meta property="og:locale" content="ar_AR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="المحاضرات الأونلاين | الأكاديمية الدولية">
    <meta name="twitter:description" content="محاضرات أونلاين متخصصة في التدريب والاستشارات العلمية.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="ol-page">
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>الأكاديمية الدولية</span>
            </a>
            <a href="login.html" id="headerQuickLogin" class="header-quick-login">تسجيل الدخول</a>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">الرئيسية</a>
                <a href="courses.html">الأقسام</a>
                <a href="lectures.html">المحاضرات</a>
                <a href="books.html">الكتب التعليمية</a>
                <div id="authButtons" style="display:flex;gap:8px;">
                    <a href="login.html" class="btn-outline">دخول</a>
                    <a href="register.html" class="btn-primary">حساب جديد</a>
                </div>
                <div id="userMenu" style="display:none;align-items:center;gap:8px;">
                    <div class="notif-bell-wrap">
                        <button type="button" class="notif-bell-btn" id="notifBellBtn" onclick="toggleNotifPanel()">
                            <i class="fas fa-bell"></i>
                            <span class="notif-badge" id="notifBadge"></span>
                        </button>
                        <div class="notif-panel" id="notifPanel">
                            <div class="notif-panel-header">الإشعارات</div>
                            <div id="notifList"></div>
                        </div>
                    </div>
                    <a href="profile.html"><span class="user-name"></span></a>
                    <button onclick="logout()" class="btn-outline" style="padding:6px 12px;">خروج</button>
                </div>
            </nav>
        </div>
    </header>

    <section class="ol-hero">
        <h1><i class="fas fa-clapperboard"></i> المحاضرات الأونلاين</h1>
        <p>4 أقسام متخصصة — 8 محاضرات في كل قسم</p>
        <a href="#" id="olWhatsappBtn" target="_blank" style="display:none;margin-top:16px;background:#25D366;color:white;padding:10px 22px;border-radius:30px;font-weight:700;align-items:center;gap:8px;">
            <i class="fab fa-whatsapp"></i> استفسر عبر واتساب
        </a>
    </section>

    <section class="ol-categories" id="olCategories"></section>

    <section class="ol-lectures-panel" id="olLecturesPanel">
        <div class="ol-lectures-panel-header">
            <h2 id="olPanelTitle">القسم</h2>
            <button type="button" class="ol-back-btn" onclick="olShowCategories()">→ رجوع للأقسام</button>
        </div>
        <div class="ol-lectures-grid" id="olLecturesGrid"></div>
    </section>

    <!-- نموذج إدخال الكود + الاسم لمشاهدة محاضرة -->
    <div class="modal-overlay" id="olAccessModal">
        <div class="modal ol-modal" style="max-width:420px;padding:28px;">
            <button type="button" class="modal-close" onclick="document.getElementById('olAccessModal').classList.remove('active')">&times;</button>
            <h3 style="color:var(--ol-accent,#F5A623);margin-bottom:16px;">الدخول للمحاضرة</h3>
            <form onsubmit="olAccessLecture(event)">
                <div class="form-group">
                    <label>الاسم الثلاثي</label>
                    <input type="text" id="olAccessName" required>
                </div>
                <div class="form-group">
                    <label>كود المحاضرة</label>
                    <input type="text" id="olAccessCode" required style="text-transform:uppercase;">
                </div>
                <button type="submit" class="ol-watch-btn" style="padding:12px;">مشاهدة المحاضرة</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© 2026 الأكاديمية الدولية</div>
    </footer>

    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js?v=6"></script>
    <script src="js/auth.js?v=6"></script>
    <script src="js/notifications.js?v=1"></script>
    <script src="js/online-lectures.js?v=1"></script>
</body>
</html>
