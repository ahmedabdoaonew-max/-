<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B4B8C">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <title>إنشاء حساب | الأكاديمية الدولية</title>
    <meta name="description" content="أنشئ حساباً جديداً في الأكاديمية الدولية وابدأ رحلتك في التدريب والاستشارات العلمية.">
    <link rel="canonical" href="https://internationalacademy.vercel.app/register.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="إنشاء حساب | الأكاديمية الدولية">
    <meta property="og:description" content="أنشئ حساباً جديداً في الأكاديمية الدولية وابدأ رحلتك في التدريب والاستشارات العلمية.">
    <meta property="og:url" content="https://internationalacademy.vercel.app/register.html">
    <meta property="og:locale" content="ar_AR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="إنشاء حساب | الأكاديمية الدولية">
    <meta name="twitter:description" content="أنشئ حساباً جديداً في الأكاديمية الدولية وابدأ رحلتك في التدريب والاستشارات العلمية.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:20px;">
                <div class="logo-icon" style="margin:0 auto 12px;width:60px;height:60px;font-size:26px;">
                    <i class="fas fa-graduation-cap"></i>
                </div>
            </div>
            <h2>إنشاء حساب جديد</h2>
            <p class="subtitle">انضم إلينا وابدأ رحلة التطوير</p>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="regName" placeholder="الاسم الثلاثي" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (اختياري)</label>
                    <input type="tel" id="regPhone" placeholder="01xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" required minlength="6">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="regConfirm" placeholder="أعد إدخال كلمة المرور" required>
                </div>
                <button type="submit" class="form-submit">إنشاء الحساب</button>
            </form>
            <p class="auth-link">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            <p class="auth-link" style="margin-top:10px;"><a href="index.html">← العودة للرئيسية</a></p>
        </div>
    </div>
    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js?v=6"></script>
    <script src="js/auth.js?v=6"></script>
</body>
</html>
