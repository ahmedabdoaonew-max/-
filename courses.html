<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B4B8C">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <title>البرامج التدريبية | الأكاديمية الدولية</title>
    <meta name="description" content="البرامج التدريبية والاستشارية في الأكاديمية الدولية للتدريب والاستشارات العلمية.">
    <link rel="canonical" href="https://internationalacademy.vercel.app/courses.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="البرامج التدريبية | الأكاديمية الدولية">
    <meta property="og:description" content="البرامج التدريبية والاستشارية في الأكاديمية الدولية للتدريب والاستشارات العلمية.">
    <meta property="og:url" content="https://internationalacademy.vercel.app/courses.html">
    <meta property="og:locale" content="ar_AR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="البرامج التدريبية | الأكاديمية الدولية">
    <meta name="twitter:description" content="البرامج التدريبية والاستشارية في الأكاديمية الدولية للتدريب والاستشارات العلمية.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>الأكاديمية الدولية</span>
            </a>
            <a href="login.html" id="headerQuickLogin" class="header-quick-login">تسجيل الدخول</a>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">الرئيسية</a>
                <a href="courses.html">الأقسام</a>
                <a href="lectures.html">المحاضرات</a>
                <a href="books.html">الكتب التعليمية</a>
                <div id="authButtons" style="display:flex;gap:8px;">
                    <a href="login.html" class="btn-outline">دخول</a>
                    <a href="register.html" class="btn-primary">حساب</a>
                </div>
                <div id="userMenu" style="display:none;align-items:center;gap:8px;">
                    <div class="notif-bell-wrap">
                        <button type="button" class="notif-bell-btn" id="notifBellBtn" onclick="toggleNotifPanel()">
                            <i class="fas fa-bell"></i>
                            <span class="notif-badge" id="notifBadge"></span>
                        </button>
                        <div class="notif-panel" id="notifPanel">
                            <div class="notif-panel-header">الإشعارات</div>
                            <div id="notifList"></div>
                        </div>
                    </div>
                    <a href="profile.html"><span class="user-name"></span></a>
                    <button onclick="logout()" class="btn-outline" style="padding:6px 12px;">خروج</button>
                </div>
            </nav>
        </div>
    </header>

    <section class="sections-area" id="sections">
        <div class="section-header">
            <h2>البرامج التدريبية</h2>
           
        </div>
        <div class="sections-grid" id="sectionsGrid"></div>
        <div id="sectionThirteenWrap" style="margin-top:20px;"></div>
    </section>
    <section class="sections-area" id="lecturesHub">
        <div class="section-header">
            <h2>المحاضرات الأونلاين</h2>
           
        </div>
        <div class="sections-grid" id="lecturesHubGrid"></div>
    </section>

    <footer class="footer">
        <div class="footer-bottom">© 2026 الأكاديمية الدولية</div>
    </footer>

    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js?v=6"></script>
    <script src="js/auth.js?v=6"></script>
    <script src="js/notifications.js?v=1"></script>
    <script src="js/courses.js?v=6"></script>
</body>
</html>
