<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحدي الانتباه | الأكاديمية الدولية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/skills.css" />
  <style>
    .att-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px;margin:0 auto;}
    .att-cell{
      aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
      font-size:1.6rem;cursor:pointer;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);
      transition:.15s;user-select:none;
    }
    .att-cell:hover{transform:scale(1.06);}
    .att-cell.found{background:#2ecc71;color:#fff;}
  </style>
</head>
<body class="skills-page">
  <header class="skills-header">
    <h1>👁️ تحدي الانتباه</h1>
    <a href="../games.html" class="back-btn"><i class="fas fa-arrow-right"></i> الألعاب</a>
  </header>
  <div class="game-wrapper">
    <div class="game-panel">
      <h2>تحدي الانتباه</h2>
      <p class="game-desc">ابحث عن الشكل المختلف عن الباقي. درّب التركيز والانتباه البصري.</p>
      <div class="score-bar">
        <span>النقاط: <b id="score">0</b></span>
        <span>المستوى: <b id="level">1</b></span>
        <span>الوقت: <b id="time">30</b>ث</span>
      </div>
      <div class="att-grid" id="grid"></div>
      <div class="game-controls" style="margin-top:16px;">
        <button class="btn-game" onclick="start()"><i class="fas fa-play"></i> ابدأ</button>
      </div>
    </div>
  </div>
<script>
const SETS=[
  ['🔴','🔵'],['⬛','⬜'],['★','☆'],['▲','●'],['🐱','🐶'],
  ['🍎','🍊'],['①','②'],['A','B'],['♥','♦'],['☀️','🌙']
];
let score=0, level=1, timer, timeLeft=30, oddIdx=-1, running=false;
function start(){
  clearInterval(timer);
  score=0; level=1; timeLeft=30; running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('level').textContent=1;
  document.getElementById('time').textContent=30;
  timer=setInterval(()=>{
    timeLeft--; document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0){clearInterval(timer);running=false;alert('انتهى الوقت! نقاطك: '+score); }
  },1000);
  nextRound();
}
function nextRound(){
  if(!running) return;
  const pair=SETS[Math.floor(Math.random()*SETS.length)];
  const common=pair[0], odd=pair[1];
  const n=Math.min(9+level,25);
  const cols=n<=16?4:5;
  const grid=document.getElementById('grid');
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML='';
  oddIdx=Math.floor(Math.random()*n);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='att-cell';
    c.textContent=i===oddIdx?odd:common;
    c.onclick=()=>{
      if(!running) return;
      if(i===oddIdx){
        c.classList.add('found');
        score++; document.getElementById('score').textContent=score;
        level++; document.getElementById('level').textContent=level;
        setTimeout(nextRound,350);
      } else {
        c.style.background='#e74c3c';
        setTimeout(()=>c.style.background='',200);
      }
    };
    grid.appendChild(c);
  }
}
</script>
</body>
</html>
