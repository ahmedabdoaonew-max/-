<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بناء الكلمات | الأكاديمية الدولية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/skills.css" />
  <style>
    .slots{display:flex;gap:8px;justify-content:center;margin:18px 0;flex-wrap:wrap;}
    .slot{
      width:48px;height:56px;border:3px solid #1B4B8C;border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;
      background:#f0f6ff;color:#1B4B8C;
    }
    .letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
    .letter{
      width:48px;height:48px;border-radius:10px;background:#1B4B8C;color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;
      cursor:pointer;user-select:none;transition:.15s;
    }
    .letter:hover{transform:scale(1.08);} .letter.used{opacity:.3;pointer-events:none;}
    .hint{text-align:center;color:#6b7c8f;margin-bottom:8px;font-size:0.95rem;}
  </style>
</head>
<body class="skills-page">
  <header class="skills-header">
    <h1>🔤 بناء الكلمات</h1>
    <a href="../games.html" class="back-btn"><i class="fas fa-arrow-right"></i> الألعاب</a>
  </header>
  <div class="game-wrapper">
    <div class="game-panel">
      <h2>بناء الكلمات</h2>
      <p class="game-desc">رتّب الحروف لتكوين الكلمة الصحيحة. يدعم مهارات التخاطب والقراءة.</p>
      <div class="score-bar">
        <span>النقاط: <b id="score">0</b></span>
        <span>الكلمة: <b id="wnum">1</b></span>
      </div>
      <div class="hint" id="hint"></div>
      <div class="slots" id="slots"></div>
      <div class="letters" id="letters"></div>
      <div class="game-controls" style="margin-top:18px;">
        <button class="btn-game secondary" onclick="resetWord()"><i class="fas fa-undo"></i> مسح</button>
        <button class="btn-game" onclick="check()"><i class="fas fa-check"></i> تحقق</button>
        <button class="btn-game success" onclick="next()"><i class="fas fa-forward"></i> التالية</button>
      </div>
    </div>
  </div>
<script>
const WORDS=[
  {w:'قلم',h:'شيء نكتب به'},
  {w:'كتاب',h:'نقرأ فيه'},
  {w:'مدرسة',h:'مكان التعلم'},
  {w:'شمس',h:'تضيء النهار'},
  {w:'قمر',h:'يظهر ليلاً'},
  {w:'وردة',h:'زهرة جميلة'},
  {w:'سمكة',h:'تعيش في الماء'},
  {w:'طائر',h:'يطير في السماء'},
  {w:'باب',h:'ندخل منه'},
  {w:'نافذة',h:'ندخل منها الضوء'}
];
let idx=0, score=0, current=[], chosen=[];
function load(){
  const item=WORDS[idx%WORDS.length];
  document.getElementById('hint').textContent='تلميح: '+item.h;
  document.getElementById('wnum').textContent=(idx%WORDS.length)+1;
  document.getElementById('score').textContent=score;
  current=item.w.split('');
  chosen=[];
  const slots=document.getElementById('slots');
  slots.innerHTML='';
  current.forEach((_,i)=>{
    const s=document.createElement('div'); s.className='slot'; s.id='slot'+i; slots.appendChild(s);
  });
  const letters=document.getElementById('letters');
  letters.innerHTML='';
  const shuffled=[...current].sort(()=>Math.random()-0.5);
  // add 2 distractors sometimes
  const extra='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('').filter(c=>!current.includes(c));
  shuffled.push(...extra.sort(()=>Math.random()-0.5).slice(0,2));
  shuffled.sort(()=>Math.random()-0.5).forEach((ch,i)=>{
    const b=document.createElement('div');
    b.className='letter'; b.textContent=ch; b.dataset.ch=ch; b.id='L'+i;
    b.onclick=()=>{
      if(b.classList.contains('used')) return;
      const empty=chosen.length;
      if(empty>=current.length) return;
      document.getElementById('slot'+empty).textContent=ch;
      chosen.push(ch);
      b.classList.add('used');
    };
    letters.appendChild(b);
  });
}
function resetWord(){
  chosen=[];
  document.querySelectorAll('.slot').forEach(s=>s.textContent='');
  document.querySelectorAll('.letter').forEach(l=>l.classList.remove('used'));
}
function check(){
  if(chosen.join('')===current.join('')){
    score++; document.getElementById('score').textContent=score;
    alert('صحيح! 🎉');
    next();
  } else {
    alert('حاول مرة أخرى');
  }
}
function next(){ idx++; load(); }
load();
</script>
</body>
</html>
