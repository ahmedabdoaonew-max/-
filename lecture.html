<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B4B8C">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <title>مشاهدة المحاضرة | الأكاديمية الدولية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>الأكاديمية الدولية</span>
            </a>
            <a href="login.html" id="headerQuickLogin" class="header-quick-login">تسجيل الدخول</a>
            <nav class="nav-links">
                <a href="lectures.html">العودة للمحاضرات</a>
                <a href="index.html">الرئيسية</a>
            </nav>
        </div>
    </header>

    <div class="lecture-player">
        <div class="lecture-info" style="margin-bottom:20px;">
            <h1 id="lectureTitle" style="color:var(--primary-dark);margin-bottom:8px;">جاري التحميل...</h1>
            <p id="viewerName" style="color:var(--text-muted);"></p>
        </div>
        <div class="video-container" id="videoPlayer">
            <!-- يتم تعبئته بواسطة lectures.js -->
        </div>
        <div class="lecture-info">
            <p style="color:#666;font-size:0.95rem;">
                <i class="fas fa-info-circle"></i>
                هذه المحاضرة محمية. لا تشارك الكود مع الآخرين. عدد المشاهدات محدود حسب إعدادات الكود.
            </p>
            <a href="lectures.html" class="btn-outline" style="display:inline-block;margin-top:16px;padding:10px 24px;border-radius:30px;">
                ← العودة لقائمة المحاضرات
            </a>
        </div>
    </div>

    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js?v=6"></script>
    <script src="js/lectures.js?v=6"></script>
</body>
</html>
